<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Sphere Gradients matching the TradORB brand asset -->
    <!-- Top solar orange gradient -->
    <linearGradient id="orbOrangeGrad" x1="15%" y1="70%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#0F6AD7" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#E65100" />
      <stop offset="70%" stop-color="#F36F21" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>

    <!-- Mid ribbon blue gradient -->
    <linearGradient id="orbBlueGrad" x1="10%" y1="80%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#071A36" />
      <stop offset="30%" stop-color="#0A2D64" />
      <stop offset="65%" stop-color="#0F6AD7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bottom deep navy ribbon gradient -->
    <linearGradient id="orbNavyGrad" x1="20%" y1="90%" x2="80%" y2="30%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="45%" stop-color="#0A2248" />
      <stop offset="85%" stop-color="#0E5BB8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Ribbon highlight glow -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Orange dot sphere in the "O" -->
    <radialGradient id="dotOrangeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="40%" stop-color="#F36F21" />
      <stop offset="90%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>
  </defs>

  <!-- 1. The Dynamic 3D TradORB Globe Symbol -->
  <g id="tradorb-symbol" transform="translate(100, 20)">
    <!-- Base / Back depth shadows -->
    <path
      d="M 50,150 C 35,115 45,75 75,45 C 110,15 165,15 210,40 C 240,60 255,90 255,120 C 255,100 240,65 200,45 C 150,20 95,28 65,60 C 40,88 35,125 50,150 Z"
      fill="url(#orbOrangeGrad)"
    />

    <!-- Lower hemisphere dark navy band -->
    <path
      d="M 45,150 C 55,200 95,240 150,255 C 205,255 245,215 255,160 C 240,195 200,235 150,235 C 100,235 60,195 45,150 Z"
      fill="url(#orbNavyGrad)"
    />

    <!-- Main dynamic sweeping ribbon across sphere -->
    <path
      d="M 40,140 C 40,90 85,45 150,45 C 190,45 230,68 250,105 C 258,122 258,142 250,165 C 235,200 195,240 140,248 C 85,240 50,195 40,140 Z"
      fill="none"
    />

    <!-- Upper solar sweeping ribbon -->
    <path
      d="M 75,55 C 120,20 185,25 230,65 C 248,82 256,105 252,130 C 242,100 220,75 180,60 C 135,42 92,52 75,55 Z"
      fill="url(#orbOrangeGrad)"
    />

    <!-- Primary helical diagonal ribbon (Navy to Electric Blue) -->
    <path
      d="M 46,145 C 48,110 70,80 102,62 C 125,50 145,55 130,75 C 110,100 85,125 75,155 C 65,185 78,215 110,232 C 145,248 190,238 225,205 C 245,185 255,155 252,130 C 258,155 250,185 228,210 C 190,248 135,255 90,232 C 55,210 42,180 46,145 Z"
      fill="url(#orbBlueGrad)"
    />

    <!-- Secondary inner spiral contour ribbon -->
    <path
      d="M 70,110 C 95,85 135,72 175,80 C 215,88 245,115 250,150 C 245,125 218,102 180,95 C 142,88 102,98 70,110 Z"
      fill="url(#orbBlueGrad)"
      opacity="0.9"
    />

    <!-- Transverse ascending ribbon loop -->
    <path
      d="M 68,170 C 82,145 110,120 155,100 C 200,80 238,82 252,110 C 245,95 210,88 165,105 C 120,122 88,150 68,170 Z"
      fill="url(#orbOrangeGrad)"
      opacity="0.85"
    />

    <!-- Glossy edge specular highlight -->
    <path
      d="M 102,65 C 140,48 185,55 225,85 C 210,70 165,58 120,68 C 105,72 90,80 82,90 C 86,80 94,70 102,65 Z"
      fill="url(#highlightGrad)"
    />
  </g>

  <!-- 2. The Wordmark: TradORB -->
  <g id="tradorb-wordmark" fill="#0A1C38">
    <!-- "Trad" -->
    <!-- 'T' -->
    <path d="M 72,370 L 126,370 L 126,382 L 105,382 L 105,436 L 93,436 L 93,382 L 72,382 Z" />
    <!-- 'r' -->
    <path d="M 132,388 L 144,388 L 144,395 C 148,390 154,387 161,387 C 163,387 165,387 167,388 L 165,399 C 163,398 161,398 158,398 C 151,398 145,403 144,411 L 144,436 L 132,436 Z" />
    <!-- 'a' -->
    <path d="M 197,388 L 209,388 L 209,436 L 197,436 L 197,430 C 193,435 186,437 179,437 C 167,437 157,428 157,413 C 157,398 168,387 181,387 C 187,387 193,389 197,393 L 197,388 Z M 197,406 C 197,402 193,398 187,398 C 179,398 171,404 171,412 C 171,421 178,426 186,426 C 192,426 197,422 197,416 L 197,406 Z" />
    <!-- 'd' -->
    <path d="M 246,370 L 258,370 L 258,436 L 246,436 L 246,430 C 242,435 235,437 228,437 C 215,437 205,426 205,412 C 205,397 215,387 228,387 C 235,387 241,390 246,394 L 246,370 Z M 246,406 C 246,402 242,398 236,398 C 228,398 219,404 219,412 C 219,421 227,426 235,426 C 241,426 246,422 246,416 L 246,406 Z" />

    <!-- "ORB" -->
    <!-- 'O' with cut-out for the orange orbital dot -->
    <g transform="translate(262, 368)">
      <path
        d="M 36,0 C 16,0 0,15 0,35 C 0,55 16,70 36,70 C 56,70 72,55 72,35 C 72,15 56,0 36,0 Z M 36,13 C 47,13 56,22 56,35 C 56,48 47,57 36,57 C 25,57 16,48 16,35 C 16,22 25,13 36,13 Z"
        fill="#0A1C38"
      />
      <!-- Trademark Orange Orbit Dot in the 'O' -->
      <circle cx="48" cy="22" r="8.5" fill="url(#dotOrangeGrad)" />
    </g>

    <!-- 'R' -->
    <path
      d="M 346,368 L 377,368 C 390,368 401,376 401,389 C 401,398 395,406 386,408 L 404,438 L 389,438 L 373,410 L 361,410 L 361,438 L 346,438 Z M 361,398 L 375,398 C 382,398 386,395 386,389 C 386,383 382,380 375,380 L 361,380 Z"
    />

    <!-- 'B' -->
    <path
      d="M 409,368 L 439,368 C 450,368 459,374 459,384 C 459,391 454,396 447,398 C 456,400 462,407 462,417 C 462,429 452,438 438,438 L 409,438 Z M 424,380 L 424,396 L 436,396 C 441,396 445,393 445,388 C 445,383 441,380 436,380 Z M 424,408 L 424,426 L 438,426 C 443,426 448,422 448,417 C 448,412 443,408 438,408 Z"
    />
  </g>

  <!-- 3. Subtitle / Tagline: THE WORLD TRADES TOGETHER -->
  <text
    x="250"
    y="488"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="14.5"
    font-weight="600"
    letter-spacing="0.32em"
    fill="#64748B"
  >THE WORLD TRADES TOGETHER</text>
</svg>
