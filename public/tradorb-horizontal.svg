      fill="url(#hOrangeGrad)"
      opacity="0.85"
    />
  </g>

  <!-- Right: Wordmark & Tagline -->
  <g transform="translate(100, 10)">
    <!-- TradORB Wordmark -->
    <g fill="#0A1C38" transform="translate(0, 38)">
      <!-- 'T' -->
      <path d="M 0,-34 L 38,-34 L 38,-25 L 23,-25 L 23,12 L 15,12 L 15,-25 L 0,-25 Z" />
      <!-- 'r' -->
      <path d="M 44,-20 L 52,-20 L 52,-15 C 55,-19 59,-21 64,-21 C 65,-21 67,-21 68,-20 L 67,-12 C 65,-13 64,-13 62,-13 C 57,-13 52,-9 52,-3 L 52,12 L 44,12 Z" />
      <!-- 'a' -->
      <path d="M 88,-20 L 96,-20 L 96,12 L 88,12 L 88,8 C 85,11 80,13 75,13 C 67,13 60,6 60,-4 C 60,-14 67,-21 76,-21 C 81,-21 85,-19 88,-16 Z M 88,-8 C 88,-11 85,-14 81,-14 C 75,-14 69,-9 69,-3 C 69,3 74,7 80,7 C 84,7 88,4 88,0 Z" />
      <!-- 'd' -->
      <path d="M 123,-34 L 131,-34 L 131,12 L 123,12 L 123,8 C 120,11 115,13 110,13 C 101,13 94,6 94,-4 C 94,-14 101,-21 110,-21 C 115,-21 119,-19 123,-16 Z M 123,-8 C 123,-11 120,-14 116,-14 C 110,-14 103,-9 103,-3 C 103,3 109,7 115,7 C 119,7 123,4 123,0 Z" />

