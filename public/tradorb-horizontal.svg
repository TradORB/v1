      <stop offset="45%" stop-color="#0A2248" />
      <stop offset="85%" stop-color="#0E5BB8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <radialGradient id="hDotOrangeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="40%" stop-color="#F36F21" />
      <stop offset="90%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>
  </defs>

  <!-- Left: 3D Orb Symbol (scaled) -->
  <g transform="translate(6, 6) scale(0.28)">
