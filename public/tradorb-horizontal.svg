<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="hOrangeGrad" x1="15%" y1="70%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#0F6AD7" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#E65100" />
      <stop offset="70%" stop-color="#F36F21" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>

    <linearGradient id="hBlueGrad" x1="10%" y1="80%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#071A36" />
      <stop offset="30%" stop-color="#0A2D64" />
      <stop offset="65%" stop-color="#0F6AD7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="hNavyGrad" x1="20%" y1="90%" x2="80%" y2="30%">
