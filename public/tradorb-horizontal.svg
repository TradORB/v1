          fill="#0A1C38"
        />
        <circle cx="32" cy="15" r="5.5" fill="url(#hDotOrangeGrad)" />
      </g>

      <!-- 'R' -->
      <path
        d="M 192,-34 L 213,-34 C 221,-34 228,-29 228,-20 C 228,-14 224,-9 218,-7 L 230,12 L 220,12 L 209,-6 L 201,-6 L 201,12 L 192,12 Z M 201,-14 L 211,-14 C 216,-14 219,-16 219,-20 C 219,-24 216,-26 211,-26 L 201,-26 Z"
      />

      <!-- 'B' -->
      <path
        d="M 235,-34 L 255,-34 C 262,-34 268,-30 268,-23 C 268,-18 265,-15 260,-13 C 266,-12 270,-7 270,0 C 270,8 263,12 254,12 L 235,12 Z M 244,-26 L 244,-16 L 253,-16 C 256,-16 259,-18 259,-21 C 259,-24 256,-26 253,-26 Z M 244,-8 L 244,4 L 254,4 C 257,4 261,1 261,-2 C 261,-5 257,-8 254,-8 Z"
      />
    </g>

    <!-- Tagline -->
    <text
      x="0"
      y="66"
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="9"
      font-weight="600"
      letter-spacing="0.25em"
      fill="#64748B"
